name: ci

# Public repo: GitHub-hosted minutes are free, so there is no CI diet. Every PR and every push to
# main runs the full set: secret scan, Flutter analyze/test/Pigeon drift, the pure Kotlin core,
# the debug APK with lint, the signed dogfood APK with its permission gate, the emulator smoke
# on API 29/33/34/36 and install-over (build N over the previous main build). Main publishes the
# phone APK to the rolling prerelease `dogfood-latest`. Branch protection requires the single
# `ci-gate` job, which always reports (docs-only changes skip the heavy jobs; the gate passes).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Pushes to main always finish: every main sha keeps its dogfood APK.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same stable as the dev host (~/tools/flutter) and Run Supreme. Bump both together.
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '21'
  DOGFOOD_PKG: app.gymsupreme.dogfood

jobs:
  changes:
    name: which paths changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # code=false only when every changed file is documentation (*.md, docs/).
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE...$HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..$SHA"
          else
            range=""
          fi
          if [ -n "$range" ] && files="$(git diff --name-only "$range")" && [ -n "$files" ] \
             && ! grep -qvE '(\.md$|^docs/)' <<< "$files"; then
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "docs-only change: heavy jobs skipped"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  secret-scan:
    name: secret scan (public repo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: tools/secret_scan.sh

  flutter:
    name: analyze + test (app, supreme_ui, gym_engine)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Package deps
        run: |
          (cd packages/supreme_ui && flutter pub get)
          (cd packages/gym_engine && dart pub get)
      - name: Pigeon output is committed and current
        run: |
          dart run pigeon --input pigeons/platform_api.dart
          git diff --exit-code -- lib/platform android/app/src/main/kotlin/app/gymsupreme/platform
      - name: Format
        # Generated Pigeon output is excluded: it is checked for drift above, not formatted.
        run: |
          dart format --output=none --set-exit-if-changed \
            $(git ls-files '*.dart' | grep -v '\.g\.dart$')
      - name: Analyze (the root analyze covers the path packages)
        run: flutter analyze
      - name: App tests
        run: flutter test
      - name: supreme_ui tests
        working-directory: packages/supreme_ui
        run: flutter test
      - name: gym_engine tests
        working-directory: packages/gym_engine
        run: dart test
      - name: Kotlin to Dart contract fixtures are identical copies
        # android/core writes them; gym_engine reads the copies. Drift or an empty dir fails.
        run: |
          kotlin=android/core/src/test/fixtures/contract
          dart=packages/gym_engine/test/fixtures/contract
          count=$(ls "$kotlin"/*.json 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then echo "::error::no Kotlin contract fixtures in $kotlin"; exit 1; fi
          diff -r "$kotlin" "$dart"
          echo "contract fixtures: $count files, identical both ways"
      # Goldens: the Linux runner is the reference renderer (the aarch64 host cannot match it).
      # When a golden test fails, the fresh PNGs are published to a short-lived release.
      - name: Render goldens on failure
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          if [ -d test/golden ]; then mkdir -p test/golden/goldens && flutter test --update-goldens test/golden; fi
      - name: Publish changed goldens to a release
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p golden-changed
          git ls-files --modified --others --exclude-standard -- test/golden/goldens 2>/dev/null | while read -r f; do
            rel="${f#test/golden/goldens/}"; mkdir -p "golden-changed/$(dirname "$rel")"; cp "$f" "golden-changed/$rel"
          done
          if [ -z "$(ls -A golden-changed)" ]; then echo "no changed goldens"; exit 0; fi
          python3 -c "import shutil; shutil.make_archive('goldens', 'zip', 'golden-changed')"
          if [ -n "$PR" ]; then tag="goldens-pr-$PR"; else tag="goldens-${{ github.run_id }}"; fi
          tools/ci_release.sh put "$tag" "goldens $tag" "Changed or new goldens from run ${{ github.run_id }}, sha ${{ github.sha }}. Unzip into test/golden/goldens. Deleted after 3 days." --replace-assets goldens.zip

  core:
    name: core tests (pure Kotlin)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: android/core
        run: ./gradlew test --no-daemon

  build-apk:
    name: debug APK + lint (minSdk 29 NewApi)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build debug APK (play flavour, app.gymsupreme.debug)
        run: flutter build apk --debug --flavor play --dart-define=BUILD_SHA=${{ github.event.pull_request.head.sha || github.sha }}
      - name: Android lint NewApi
        working-directory: android
        run: ./gradlew :app:lintPlayDebug --no-daemon
      - name: App JVM unit tests
        working-directory: android
        run: ./gradlew :app:testPlayDebugUnitTest --no-daemon

  build-dogfood:
    name: dogfood APK (signed, R8) + permission gate
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    outputs:
      has_prev: ${{ steps.prev.outputs.has_prev }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Decode dogfood keystore (repo secrets GYM_DOGFOOD_*)
        env:
          KS_B64: ${{ secrets.GYM_DOGFOOD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::GYM_DOGFOOD_KEYSTORE_BASE64 secret missing" >&2; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dogfood.jks"
          echo "GYM_DOGFOOD_KEYSTORE=$RUNNER_TEMP/dogfood.jks" >> "$GITHUB_ENV"
      - name: Stamp version 0.1.0+<run number> (versionCode rises every build, so N installs over N-1)
        run: |
          sed -i "s/^version: .*/version: 0.1.0+${{ github.run_number }}/" pubspec.yaml
          grep -n '^version:' pubspec.yaml
      - name: Build dogfood APKs (arm64 for the phone, x86_64 for the emulators)
        env:
          GYM_DOGFOOD_STORE_PASSWORD: ${{ secrets.GYM_DOGFOOD_STORE_PASSWORD }}
          GYM_DOGFOOD_KEY_ALIAS: dogfood  # not a secret: a secret value here masks the word in logs
          GYM_DOGFOOD_KEY_PASSWORD: ${{ secrets.GYM_DOGFOOD_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor dogfood --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --obfuscate --split-debug-info=build/symbols-dogfood \
            --dart-define=BUILD_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          ls -la build/app/outputs/flutter-apk/
      - name: Verify signer, application id, permissions, 16 KB alignment
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for abi in arm64-v8a x86_64; do
            APK=build/app/outputs/flutter-apk/app-$abi-dogfood-release.apk
            "$BT/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/signer.txt" 2>&1 || { cat "$RUNNER_TEMP/signer.txt"; exit 1; }
            grep -E "certificate DN|certificate SHA-256" "$RUNNER_TEMP/signer.txt" || cat "$RUNNER_TEMP/signer.txt"
            grep -q "CN=Gym Supreme dogfood" "$RUNNER_TEMP/signer.txt" || { echo "::error::$abi APK is not signed with the dogfood key"; exit 1; }
            "$BT/aapt" dump badging "$APK" | grep -E "^package:" | tee "$RUNNER_TEMP/pkg.txt"
            grep -q "name='$DOGFOOD_PKG'" "$RUNNER_TEMP/pkg.txt" || { echo "::error::unexpected applicationId"; exit 1; }
            tools/check_manifest_permissions.sh "$APK" "$BT/aapt"
            tools/check_16kb_alignment.sh "$APK" "$BT/zipalign"
          done
          SIZE=$(stat -c %s build/app/outputs/flutter-apk/app-arm64-v8a-dogfood-release.apk)
          echo "### Dogfood APK: $((SIZE / 1048576)) MiB ($DOGFOOD_PKG, arm64-v8a, R8)" >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch build N-1 (previous main x64 APK) for install-over
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          if gh release download dogfood-latest --dir prev --pattern 'gym-supreme-dogfood-*-x64.apk' 2>/dev/null \
             && [ -n "$(ls prev)" ]; then
            mv prev/*.apk prev-x86_64-dogfood.apk
            echo "has_prev=true" >> "$GITHUB_OUTPUT"
            echo "build N-1: $(gh release view dogfood-latest --json name -q .name)"
          else
            echo "has_prev=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no dogfood-latest x64 APK yet (first main build): install-over SKIPPED this run"
          fi
      - name: Publish APKs (this run's release for the emulators; main also to dogfood-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha7="${GITHUB_SHA::7}"
          out=build/app/outputs/flutter-apk
          cp $out/app-arm64-v8a-dogfood-release.apk "$out/gym-supreme-dogfood-$sha7-arm64.apk"
          cp $out/app-x86_64-dogfood-release.apk "$out/gym-supreme-dogfood-$sha7-x64.apk"
          files=("$out/app-x86_64-dogfood-release.apk")
          [ -f prev-x86_64-dogfood.apk ] && files+=(prev-x86_64-dogfood.apk)
          tools/ci_release.sh put "ci-apk-${{ github.run_id }}" "ci apks ${{ github.run_id }}" "Dogfood APKs, run ${{ github.run_id }}, sha ${{ github.sha }}. Deleted after 2 days." "${files[@]}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tools/ci_release.sh put dogfood-latest "Dogfood APK $sha7" "Latest dogfood build from main. sha ${{ github.sha }}, CI run ${{ github.run_id }}. arm64 for the phone, x64 for the emulators; replaced on every main push." --replace-assets "$out/gym-supreme-dogfood-$sha7-arm64.apk" "$out/gym-supreme-dogfood-$sha7-x64.apk"
          fi

  emulator:
    name: emulator smoke (API ${{ matrix.api-level }})
    needs: build-dogfood
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 33, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Download this run's dogfood x64 APK (and build N-1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci_release.sh get "ci-apk-${{ github.run_id }}" apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Boot, install, launch (+ install-over on API 36)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          INSTALL_OVER: ${{ matrix.api-level == 36 && needs.build-dogfood.outputs.has_prev == 'true' }}
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            if [ "$INSTALL_OVER" = "true" ]; then tools/emulator_install_over.sh apk/prev-x86_64-dogfood.apk apk/app-x86_64-dogfood-release.apk "$DOGFOOD_PKG"; else echo "install-over not run on this job (API ${{ matrix.api-level }}, has_prev=${{ needs.build-dogfood.outputs.has_prev }})"; fi
            tools/emulator_smoke.sh apk/app-x86_64-dogfood-release.apk "$DOGFOOD_PKG"

  artifact-cleanup:
    name: trim old CI releases
    needs: [build-dogfood, emulator]
    if: ${{ always() && !cancelled() && needs.build-dogfood.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/ci_release.sh prune goldens- 3
          tools/ci_release.sh prune ci-apk- 2

  ci-gate:
    # The one required status check. Passes only when every job succeeded or was skipped by the
    # docs-only filter; a failed or cancelled job fails it.
    name: ci-gate
    needs: [changes, secret-scan, flutter, core, build-apk, build-dogfood, emulator]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, os, sys
          needs = json.load(sys.stdin)
          code = os.environ.get("CODE") == "true"
          bad = []
          for name, n in needs.items():
              r = n["result"]
              ok = r == "success" or (r == "skipped" and not code and name not in ("changes", "secret-scan"))
              print(f"{name}: {r}")
              if not ok: bad.append(f"{name}={r}")
          if bad: sys.exit("ci-gate failed: " + ", ".join(bad))
          print("ci-gate ok")'
