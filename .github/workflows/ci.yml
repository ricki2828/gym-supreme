name: ci

# Public repo: GitHub-hosted minutes are free, so there is no CI diet. Every PR and every push to
# main runs the full set: secret scan, Flutter analyze/test/Pigeon drift, the pure Kotlin core,
# the debug APK with lint, the signed dogfood APK with its permission gate, the emulator smoke
# on API 29/33/34/36 and install-over (build N over the previous main build). Main publishes the
# phone APK to the rolling prerelease `dogfood-latest`. Branch protection requires the single
# `ci-gate` job, which always reports (docs-only changes skip the heavy jobs; the gate passes).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Main runs are never cancelled mid-run, but a newer queued main run replaces a pending one,
  # so not every main sha gets an APK. dogfood-latest always tracks the newest finished main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same stable as the dev host (~/tools/flutter) and Run Supreme. Bump both together.
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '21'
  DOGFOOD_PKG: app.gymsupreme.dogfood
  # Cut-2 features compiled ON in the dogfood build (lib/app/feature_flags.dart). Set with the repo
  # variable GS_FEATURES (e.g. ghost,rotation) only on t3x's call; empty = all off (APK 0.1).
  GS_FEATURES: ${{ vars.GS_FEATURES || '' }}
  # Pinned base for the schema v1 -> v2 migration install-over (API 36 emulator job). A real 0.2.0
  # (schema v1) APK; dogfood-latest is already v2 so it cannot prove the migration.
  # Keep until 0.3.0 ships; then move to v0.2.1-dogfood.
  MIGRATION_BASE_TAG: v0.2.0-dogfood
  MIGRATION_BASE_APK: gym-supreme-dogfood-3076e4c-x64.apk
  MIGRATION_BASE_SHA256: 5a27556262f19ba218f9a6c78dde0b19a9d6004e26a9a5a284223749d8f16776

jobs:
  changes:
    name: which paths changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # code=false only when every changed file is documentation (root-level *.md, docs/).
          # Bundled .md assets (e.g. a data LICENSE.md) still run everything.
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE...$HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..$SHA"
          else
            range=""
          fi
          if [ -n "$range" ] && files="$(git diff --name-only "$range")" && [ -n "$files" ] \
             && ! grep -qvE '(^[^/]+\.md$|^docs/)' <<< "$files"; then
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "docs-only change: heavy jobs skipped"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  secret-scan:
    name: secret scan (public repo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: tools/secret_scan.sh

  flutter:
    name: analyze + test (app, supreme_ui, gym_engine)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Package deps
        run: |
          (cd packages/supreme_ui && flutter pub get)
          (cd packages/gym_engine && dart pub get)
      - name: Pigeon output is committed and current
        run: |
          dart run pigeon --input pigeons/platform_api.dart
          drift="$(git status --porcelain -- lib/platform android/app/src/main/kotlin/app/gymsupreme/platform)"
          if [ -n "$drift" ]; then echo "::error::Pigeon output drifted or is untracked:"; echo "$drift"; git diff; exit 1; fi
      - name: Format
        # Generated Pigeon output is excluded: it is checked for drift above, not formatted.
        run: |
          dart format --output=none --set-exit-if-changed \
            $(git ls-files '*.dart' | grep -v '\.g\.dart$')
      - name: Analyze (the root analyze covers the path packages)
        run: flutter analyze
      - name: App tests
        run: flutter test
      - name: App tests with every cut-2 feature ON (GS_FEATURES=all; goldens excluded, they are drawn flags-off)
        # Flagged code must not rot while its flag is off in a release (review 0.1.1, item 5c).
        run: flutter test --dart-define=GS_FEATURES=all test/app test/screens test/cut2
      - name: supreme_ui tests
        working-directory: packages/supreme_ui
        run: flutter test
      - name: Exercise data is current (tools/build_exercises.py --check; unknown ids or asset drift fail)
        run: python3 tools/build_exercises.py --check
      - name: gym_engine tests
        working-directory: packages/gym_engine
        run: dart test
      - name: Kotlin to Dart contract fixtures are identical copies
        # android/core writes them; gym_engine reads the copies. Drift or an empty dir fails.
        run: |
          kotlin=android/core/src/test/fixtures/contract
          dart=packages/gym_engine/test/fixtures/contract
          count=$(ls "$kotlin"/*.json 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then echo "::error::no Kotlin contract fixtures in $kotlin"; exit 1; fi
          diff -r "$kotlin" "$dart"
          echo "contract fixtures: $count files, identical both ways"
      # Goldens: the Linux runner is the reference renderer (the aarch64 host cannot match it).
      # When a golden test fails, the fresh PNGs are published to a short-lived release.
      - name: Render goldens on failure
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          if [ -d test/golden ]; then mkdir -p test/golden/goldens && flutter test --update-goldens test/golden; fi
      - name: Publish changed goldens to a release
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p golden-changed
          git ls-files --modified --others --exclude-standard -- test/golden/goldens 2>/dev/null | while read -r f; do
            rel="${f#test/golden/goldens/}"; mkdir -p "golden-changed/$(dirname "$rel")"; cp "$f" "golden-changed/$rel"
          done
          if [ -z "$(ls -A golden-changed)" ]; then echo "no changed goldens"; exit 0; fi
          python3 -c "import shutil; shutil.make_archive('goldens', 'zip', 'golden-changed')"
          if [ -n "$PR" ]; then tag="goldens-pr-$PR"; else tag="goldens-${{ github.run_id }}"; fi
          tools/ci_release.sh put "$tag" "goldens $tag" "Changed or new goldens from run ${{ github.run_id }}, sha ${{ github.sha }}. Unzip into test/golden/goldens. Deleted after 3 days." --replace-assets goldens.zip

  core:
    name: core tests (pure Kotlin)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: android/core
        run: ./gradlew test --no-daemon

  build-apk:
    name: debug APK + lint (minSdk 29 NewApi)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build debug APK (play flavour, app.gymsupreme.debug)
        run: flutter build apk --debug --flavor play --dart-define=BUILD_SHA=${{ github.event.pull_request.head.sha || github.sha }}
      - name: Android lint NewApi
        working-directory: android
        run: ./gradlew :app:lintPlayDebug --no-daemon
      - name: App JVM unit tests
        working-directory: android
        run: ./gradlew :app:testPlayDebugUnitTest --no-daemon

  build-dogfood:
    name: dogfood APK (signed, R8) + permission gate
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    outputs:
      has_prev: ${{ steps.prev.outputs.has_prev }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Decode dogfood keystore (repo secrets GYM_DOGFOOD_*)
        env:
          KS_B64: ${{ secrets.GYM_DOGFOOD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::GYM_DOGFOOD_KEYSTORE_BASE64 secret missing" >&2; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dogfood.jks"
          echo "GYM_DOGFOOD_KEYSTORE=$RUNNER_TEMP/dogfood.jks" >> "$GITHUB_ENV"
      - name: Stamp build number <run_number*10 + run_attempt> (rises every build, re-runs included)
        # versionName = the label in pubspec.yaml (bump it per dogfood release: 0.1.1, 0.2.0, ...);
        # only the +build part is stamped. run_number resets if this workflow is renamed or
        # recreated: then raise the base offset above the phone's installed versionCode, or the
        # update is refused.
        run: |
          code=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))
          grep -qE '^version: [0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$' pubspec.yaml || { echo "::error::pubspec version must be X.Y.Z+N"; exit 1; }
          sed -i -E "s/^(version: [0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1+$code/" pubspec.yaml
          grep -n '^version:' pubspec.yaml
          echo "### Dogfood version: $(sed -n 's/^version: //p' pubspec.yaml)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build dogfood APKs (arm64 for the phone, x86_64 for the emulators)
        env:
          GYM_DOGFOOD_STORE_PASSWORD: ${{ secrets.GYM_DOGFOOD_STORE_PASSWORD }}
          GYM_DOGFOOD_KEY_ALIAS: dogfood  # not a secret: a secret value here masks the word in logs
          GYM_DOGFOOD_KEY_PASSWORD: ${{ secrets.GYM_DOGFOOD_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor dogfood --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --obfuscate --split-debug-info=build/symbols-dogfood \
            --dart-define=BUILD_SHA=${{ github.event.pull_request.head.sha || github.sha }} \
            --dart-define=GS_FEATURES="$GS_FEATURES" \
            --dart-define=APP_VERSION="$(sed -n 's/^version: //p' pubspec.yaml)"
          echo "### Dogfood features: '${GS_FEATURES:-none (all off)}'" >> "$GITHUB_STEP_SUMMARY"
          ls -la build/app/outputs/flutter-apk/
      - name: Verify signer, application id, permissions, 16 KB alignment
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for abi in arm64-v8a x86_64; do
            APK=build/app/outputs/flutter-apk/app-$abi-dogfood-release.apk
            "$BT/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/signer.txt" 2>&1 || { cat "$RUNNER_TEMP/signer.txt"; exit 1; }
            grep -E "certificate DN|certificate SHA-256" "$RUNNER_TEMP/signer.txt" || cat "$RUNNER_TEMP/signer.txt"
            grep -q "CN=Gym Supreme dogfood" "$RUNNER_TEMP/signer.txt" || { echo "::error::$abi APK is not signed with the dogfood key"; exit 1; }
            "$BT/aapt" dump badging "$APK" | grep -E "^package:" | tee "$RUNNER_TEMP/pkg.txt"
            grep -q "name='$DOGFOOD_PKG'" "$RUNNER_TEMP/pkg.txt" || { echo "::error::unexpected applicationId"; exit 1; }
            label="$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)"
            grep -q "versionName='$label-dogfood'" "$RUNNER_TEMP/pkg.txt" || { echo "::error::versionName is not $label-dogfood"; exit 1; }
            tools/check_manifest_permissions.sh "$APK" "$BT" "$DOGFOOD_PKG"
            tools/check_16kb_alignment.sh "$APK" "$BT/zipalign"
          done
          SIZE=$(stat -c %s build/app/outputs/flutter-apk/app-arm64-v8a-dogfood-release.apk)
          echo "### Dogfood APK: $((SIZE / 1048576)) MiB ($DOGFOOD_PKG, arm64-v8a, R8)" >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch build N-1 (previous main x64 APK) for install-over
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only "the release does not exist yet" may skip install-over; any other error fails.
          if ! view="$(gh release view dogfood-latest --json name,assets 2>&1)"; then
            if grep -qi 'release not found' <<< "$view"; then
              echo "has_prev=false" >> "$GITHUB_OUTPUT"
              echo "::warning::no dogfood-latest release yet (first main build): install-over SKIPPED this run"
              exit 0
            fi
            echo "$view" >&2; echo "::error::cannot read dogfood-latest"; exit 1
          fi
          # Newest x64 asset (an interrupted publish can leave two for a moment).
          asset="$(gh release view dogfood-latest --json assets -q '[.assets[] | select(.name | test("^gym-supreme-dogfood-.*-x64\\.apk$"))] | sort_by(.createdAt) | last | .name // empty')"
          [ -n "$asset" ] || { echo "::error::dogfood-latest has no x64 APK"; exit 1; }
          mkdir -p prev
          gh release download dogfood-latest --dir prev --pattern "$asset"
          mv "prev/$asset" prev-x86_64-dogfood.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          vc() { "$BT/aapt" dump badging "$1" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p"; }
          prev_vc="$(vc prev-x86_64-dogfood.apk)"; new_vc="$(vc build/app/outputs/flutter-apk/app-x86_64-dogfood-release.apk)"
          [[ $prev_vc =~ ^[0-9]+$ && $new_vc =~ ^[0-9]+$ ]] || { echo "::error::could not read versionCodes (prev='$prev_vc' new='$new_vc')"; exit 1; }
          echo "build N-1: $asset (versionCode $prev_vc); build N: versionCode $new_vc"
          if [ "$prev_vc" -ge "$new_vc" ]; then
            # dogfood-latest is newer than this build: a PR that started before a newer main run
            # published, or a re-run of an old main run. No install-over, and never publish it.
            rm prev-x86_64-dogfood.apk
            echo "has_prev=false" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::dogfood-latest ($prev_vc) is newer than this build ($new_vc): install-over SKIPPED and dogfood-latest left alone; push again to test install-over"
            exit 0
          fi
          echo "has_prev=true" >> "$GITHUB_OUTPUT"
      - name: Publish APKs (this run's release for the emulators; main also to dogfood-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha7="${GITHUB_SHA::7}"
          out=build/app/outputs/flutter-apk
          cp $out/app-arm64-v8a-dogfood-release.apk "$out/gym-supreme-dogfood-$sha7-arm64.apk"
          cp $out/app-x86_64-dogfood-release.apk "$out/gym-supreme-dogfood-$sha7-x64.apk"
          files=("$out/app-x86_64-dogfood-release.apk")
          [ -f prev-x86_64-dogfood.apk ] && files+=(prev-x86_64-dogfood.apk)
          tools/ci_release.sh put "ci-apk-${{ github.run_id }}" "ci apks ${{ github.run_id }}" "Dogfood APKs, run ${{ github.run_id }}, sha ${{ github.sha }}. Deleted after 2 days." "${files[@]}"
          # The fetch step sets publish=false when dogfood-latest is already newer than this build.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ steps.prev.outputs.publish }}" != "false" ]; then
            tools/ci_release.sh put dogfood-latest "Dogfood APK $sha7" "Latest dogfood build from main. sha ${{ github.sha }}, CI run ${{ github.run_id }}. arm64 for the phone, x64 for the emulators; replaced on every main push." --replace-assets "$out/gym-supreme-dogfood-$sha7-arm64.apk" "$out/gym-supreme-dogfood-$sha7-x64.apk"
          fi

  emulator:
    name: emulator smoke (API ${{ matrix.api-level }})
    needs: build-dogfood
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 33, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Download this run's dogfood x64 APK (and build N-1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci_release.sh get "ci-apk-${{ github.run_id }}" apk
      - name: Fetch pinned migration base (0.2.0, schema v1; API 36 only)
        if: matrix.api-level == 36
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MIGRATION_BASE_TAG" --dir apk --pattern "$MIGRATION_BASE_APK"
          echo "$MIGRATION_BASE_SHA256  apk/$MIGRATION_BASE_APK" | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Boot, install, launch (+ install-over and v1->v2 migration on API 36)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          INSTALL_OVER: ${{ matrix.api-level == 36 && needs.build-dogfood.outputs.has_prev == 'true' }}
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            if [ "$INSTALL_OVER" = "true" ]; then tools/emulator_install_over.sh apk/prev-x86_64-dogfood.apk apk/app-x86_64-dogfood-release.apk "$DOGFOOD_PKG"; else echo "install-over not run on this job (API ${{ matrix.api-level }}, has_prev=${{ needs.build-dogfood.outputs.has_prev }})"; fi
            if [ "${{ matrix.api-level }}" = "36" ]; then tools/emulator_migration_over.sh "apk/$MIGRATION_BASE_APK" apk/app-x86_64-dogfood-release.apk "$DOGFOOD_PKG"; fi
            tools/emulator_smoke.sh apk/app-x86_64-dogfood-release.apk "$DOGFOOD_PKG"

  ui-e2e:
    # Widget-driven flow on a real device (t60's integration_test/ui_flow_test.dart): picker tap
    # path and post-workout screen over the real WorkoutService and SQLite store. One API level
    # (34) to bound minutes; the headless e2e in tools/emulator_smoke.sh covers all four.
    name: UI flow e2e (API 34, integration_test)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Boot API 34 and run the UI flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: BUILD_SHA=${{ github.sha }} tools/ui_e2e.sh emulator-5554

  artifact-cleanup:
    name: trim old CI releases
    needs: [build-dogfood, emulator]
    if: ${{ always() && !cancelled() && needs.build-dogfood.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/ci_release.sh prune goldens- 3
          tools/ci_release.sh prune ci-apk- 2

  ci-gate:
    # The one required status check. Passes only when every job succeeded or was skipped by the
    # docs-only filter; a failed or cancelled job fails it.
    name: ci-gate
    needs: [changes, secret-scan, flutter, core, build-apk, build-dogfood, emulator, ui-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, os, sys
          needs = json.load(sys.stdin)
          code = os.environ.get("CODE") == "true"
          bad = []
          for name, n in needs.items():
              r = n["result"]
              ok = r == "success" or (r == "skipped" and not code and name not in ("changes", "secret-scan"))
              print(f"{name}: {r}")
              if not ok: bad.append(f"{name}={r}")
          if bad: sys.exit("ci-gate failed: " + ", ".join(bad))
          print("ci-gate ok")'
