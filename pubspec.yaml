name: gym_supreme
description: "Gym Supreme: local-only Android strength log with a lock-screen workout service."
publish_to: 'none'

# versionName = the dogfood release label (bump per release: 0.1.1 was cut from 0.1.0 code;
# 0.2.0 = ghost + rotation on). CI stamps only the +N build number (versionCode).
version: 0.3.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  gym_engine:
    path: packages/gym_engine
  supreme_ui:
    path: packages/supreme_ui
  # SQLite is the source of truth (plan 7). 3.x bundles the native library through build
  # hooks (sqlite3_flutter_libs is EOL); CI proves it loads on every emulator API level.
  sqlite3: ^3.9.2
  # files/ directory for gym.db (getApplicationSupportDirectory). No permissions.
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^26.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/exercises.json
    - assets/exercises_taxonomy.json
    - assets/fonts/OFL-SairaExtraCondensed.txt
    - assets/fonts/OFL-SchibstedGrotesk.txt

  # Bundled (OFL, see assets/fonts/OFL-*.txt). Nothing is fetched at runtime: no INTERNET.
  fonts:
    - family: Saira Extra Condensed
      fonts:
        - asset: assets/fonts/SairaExtraCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/SairaExtraCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/SairaExtraCondensed-ExtraBold.ttf
          weight: 800
    - family: Schibsted Grotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk-Variable.ttf
